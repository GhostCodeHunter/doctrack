<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocTrack — Document Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --sunk:#F0F3F7; --line:#E3E7ED; --line-2:#D3D9E2;
  --ink:#151B26; --ink-2:#465264; --ink-3:#5F6B7D;
  --accent:#3355D6; --accent-ink:#FFFFFF; --accent-soft:#EBEFFC; --accent-line:#C9D3F5;
  --ok:#147A3D; --ok-soft:#E6F5EC; --ok-line:#BCE3CB;
  --wait:#A35200; --wait-soft:#FFF3E0; --wait-line:#F5D6A8;
  --bad:#B42A20; --bad-soft:#FDECEA; --bad-line:#F4C3BE;
  --r-sm:8px; --r:12px; --r-lg:16px; --pill:999px;
  --sh:0 1px 2px rgba(21,27,38,.05),0 1px 1px rgba(21,27,38,.03);
  --sh-lg:0 12px 32px rgba(21,27,38,.12),0 2px 6px rgba(21,27,38,.06);
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
#app{min-height:100vh}
body{font-family:var(--font);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#2846BA}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger:hover{background:#962219}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn.icon{width:40px;padding:0}
.btn.icon.sm{width:34px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.text-bad{color:var(--bad)}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12.5px;color:var(--ink-3)}
.input,textarea.input,select.input{width:100%;height:42px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.sm{height:36px;font-size:14px}
.input::placeholder{color:#8A94A3}
.err{font-size:12.5px;color:var(--bad);font-weight:500}

/* ===== Login — warm cream, arch panel ===== */
.login{--c-bg:#FDF6F0;--c-ink:#3A2E27;--c-ink2:#6B5A4E;--c-line:#D9C9BD;--c-peach:#FCE3D2;--c-peach2:#F9D4BC;--c-brown:#8A4B23;
  min-height:100vh;background:var(--c-bg);color:var(--c-ink);font-family:"Rubik",var(--font);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch}
.login .brand{position:absolute;top:28px;left:32px;color:var(--c-ink)}
.login .mark{background:var(--c-brown)}
.login-main{position:relative;display:flex;align-items:center;justify-content:center;padding:96px 24px 48px}
.login-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:22px}
.login-card h2{font-family:"Rubik",var(--font);font-size:34px;font-weight:800;letter-spacing:-.01em;text-align:center;color:var(--c-ink)}
.login-card .sub{text-align:center;color:var(--c-ink2);margin-top:8px;font-size:15px}
.fl{position:relative;display:flex;align-items:center;gap:12px;height:54px;padding:0 20px;border:1.5px solid var(--c-line);border-radius:999px;background:transparent;transition:border-color .15s,box-shadow .15s}
.fl:focus-within{border-color:var(--c-brown);box-shadow:0 0 0 4px rgba(138,75,35,.10)}
.fl.bad{border-color:var(--bad)}
.fl>label{position:absolute;top:-10px;left:22px;padding:0 6px;background:var(--c-bg);font-size:13px;font-weight:600;color:var(--c-ink2);line-height:18px}
.fl>label .opt{font-weight:400;color:#8C7A6E}
.fl svg.i{color:#8C7A6E}
.fl input{flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;font-size:16px;color:var(--c-ink);outline:none}
.fl input::placeholder{color:#A8968A}
.login .err{padding-left:22px;margin-top:-12px}
.lbtn{height:52px;border:0;border-radius:999px;background:var(--c-peach);color:var(--c-brown);font:inherit;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .15s,transform .15s}
.lbtn:hover{background:var(--c-peach2)}
.lbtn:active{transform:scale(.99)}
.lbtn:focus-visible{outline:2px solid var(--c-brown);outline-offset:3px}
.or{display:flex;align-items:center;justify-content:center;gap:10px;color:#8C7A6E;font-size:13px}
.or:before,.or:after{content:"";width:28px;height:1px;background:var(--c-line)}
.socials{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
#gsiBtn{display:flex;justify-content:center;min-height:44px}
.known{display:flex;flex-direction:column;gap:8px}
.known p{font-size:13px;font-weight:600;color:var(--c-ink2);text-align:center}
.known button{display:flex;align-items:center;gap:12px;height:56px;padding:0 10px;border:1.5px solid var(--c-line);border-radius:999px;background:#fff;text-align:left;font:inherit;color:var(--c-ink)}
.known button:hover{border-color:var(--c-brown)}
.known .avatar{background:var(--c-peach);color:var(--c-brown)}
.foot{text-align:center;font-size:13.5px;color:var(--c-ink2)}
.setup{font-size:13.5px;color:var(--c-ink2)}
.setup summary{cursor:pointer;list-style:none;text-align:center;font-weight:600;color:var(--c-brown)}
.setup summary::-webkit-details-marker{display:none}
.setup[open]{background:#fff;border:1.5px solid var(--c-line);border-radius:20px;padding:16px 18px}
.setup p{margin-top:10px;line-height:1.5}
.setup .row{display:flex;gap:8px;margin-top:12px}
.setup .input{border-radius:999px;border-color:var(--c-line)}
.setup .btn{border-radius:999px;background:var(--c-peach);border-color:var(--c-peach);color:var(--c-brown)}
.login-art{position:relative;display:flex;align-items:flex-end;justify-content:center;padding:48px 48px 0}
.arch{position:relative;width:min(440px,100%);height:min(78vh,640px);background:linear-gradient(180deg,var(--c-peach) 0%,#FBDDC9 100%);border-radius:999px 999px 0 0;display:flex;align-items:center;justify-content:center;overflow:visible}
.arch svg{width:118%;max-width:none;height:auto;margin-left:-26%;filter:drop-shadow(0 18px 24px rgba(138,75,35,.16))}
.arch .note{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-size:14px;color:var(--c-brown);font-weight:500;padding:0 32px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center}
.mark svg{width:18px;height:18px}

/* ===== App shell ===== */
.menubar{position:sticky;top:0;z-index:20;height:62px;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.menubar-in{max-width:1320px;margin:0 auto;height:100%;padding:0 24px;display:flex;align-items:center;gap:24px}
.nav{display:flex;gap:4px;align-items:center}
.nav button{height:38px;padding:0 14px;border-radius:var(--r-sm);border:0;background:transparent;font-weight:600;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .count{font-size:12px;background:var(--wait-soft);color:var(--wait);padding:1px 7px;border-radius:var(--pill);font-weight:700}
.spacer{flex:1}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.userbtn{display:flex;align-items:center;gap:10px;height:42px;padding:0 8px 0 4px;border:1px solid transparent;border-radius:var(--pill);background:transparent}
.userbtn:hover{background:var(--sunk)}
.userbtn .who{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left}
.userbtn .who b{font-size:13.5px}
.userbtn .who span{font-size:12px;color:var(--ink-3)}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);padding:6px;display:none;z-index:40}
.menu.open{display:block}
.menu button,.menu label{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border:0;background:transparent;border-radius:var(--r-sm);font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.menu button:hover,.menu label:hover{background:var(--sunk)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.rel{position:relative}

main{max-width:1320px;margin:0 auto;padding:28px 24px 64px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h1{font-size:26px}
.pagehead .meta{color:var(--ink-3);margin-top:4px;font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-3);margin-bottom:8px}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--pill);font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--ink-2);border:1px solid var(--line)}

/* capsule bar */
.capsulebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);box-shadow:var(--sh);margin-bottom:20px}
.capsules{display:flex;gap:4px;flex-wrap:wrap}
.cap{height:36px;padding:0 14px;border-radius:var(--pill);border:1px solid transparent;background:transparent;font-weight:600;font-size:13.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s}
.cap:hover{background:var(--sunk);color:var(--ink)}
.cap[aria-pressed="true"]{background:var(--ink);color:#fff}
.cap .n{font-size:12px;padding:0 7px;border-radius:var(--pill);background:rgba(21,27,38,.07);min-width:22px;text-align:center}
.cap[aria-pressed="true"] .n{background:rgba(255,255,255,.18)}
.cap .sw{width:8px;height:8px;border-radius:50%}
.vsep{width:1px;height:24px;background:var(--line)}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;height:36px;border-radius:var(--pill);border:1px solid var(--line);background:var(--sunk);padding:0 14px 0 38px}
.search input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15.5px}
.card-b{padding:20px}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.kpi .l{font-size:13px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:8px}
.kpi .v{font-size:28px;font-weight:700;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi.ok .v{color:var(--ok)} .kpi.wait .v{color:var(--wait)} .kpi.bad .v{color:var(--bad)}
.bar{height:8px;border-radius:var(--pill);background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:#2E9E5B} .bar .b-wait{background:#E39A2D} .bar .b-bad{background:#D9534A}

/* project grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:14px;padding:20px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh);transition:border-color .15s,box-shadow .2s var(--ease),transform .2s var(--ease);cursor:pointer}
.pcard:hover{border-color:var(--accent-line);box-shadow:var(--sh-lg);transform:translateY(-1px)}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pcard h3{font-size:17px}
.pcard .stats{display:flex;gap:16px;font-size:13px;color:var(--ink-3)}
.pcard .stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.pct{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.pnew{border:1.5px dashed var(--line-2);background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--ink-2);min-height:170px;font-weight:600}
.pnew:hover{background:var(--surface)}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:56px 24px}
.empty .ic{width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty .ic svg{width:24px;height:24px}
.empty h3{font-size:18px}
.empty p{color:var(--ink-3);max-width:44ch}

/* overview */
.ovgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:10px 16px;background:var(--sunk);border-bottom:1px solid var(--line)}
table.t td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#FAFBFD}
table.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.typebar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.typebar:last-child{border-bottom:0}
.typebar .nm{font-weight:600;font-size:14px}
.typebar .ct{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.typebar .bar{grid-column:1/-1}

/* tasks layout */
.tasks{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.tlist{position:sticky;top:82px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.tlist .card-h{padding:14px 16px}
.tl-scroll{overflow-y:auto;padding:6px}
.titem{width:100%;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid transparent;border-radius:var(--r);background:transparent;text-align:left}
.titem:hover{background:var(--sunk)}
.titem[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent-line)}
.titem .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.titem .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--pill);font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.wait{background:var(--wait-soft);color:var(--wait)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.done{background:var(--ok);color:#fff}
.dpanel{scroll-margin-top:74px}
.dpanel .card-h{flex-wrap:wrap}
.dpanel .title{display:flex;flex-direction:column;gap:4px;min-width:0}
.dpanel .title h3{font-size:18px}
.back{display:none}

/* doc rows */
.docs{display:flex;flex-direction:column}
.doc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 16px;padding:16px 20px;border-bottom:1px solid var(--line);align-items:center;transition:background .2s}
.doc:last-child{border-bottom:0}
.doc.is-received{background:#FBFEFC}
.doc .dn{display:flex;align-items:center;gap:12px;min-width:0}
.doc .dn .nm{font-weight:600}
.doc.is-received .dn .nm{color:var(--ink-3);text-decoration:line-through;text-decoration-color:rgba(20,122,61,.45)}
.doc .dn .cat{font-size:12px;color:var(--ink-3)}
.check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line-2);background:#fff;display:grid;place-items:center;flex:none;padding:0;transition:background .15s,border-color .15s}
.check svg{width:14px;height:14px;stroke:#fff;stroke-width:3;opacity:0}
.check:hover{border-color:var(--ok)}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.check[aria-checked="true"] svg{opacity:1}
.seg{display:inline-flex;padding:3px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--pill)}
.seg button{height:30px;padding:0 12px;border:0;border-radius:var(--pill);background:transparent;font-size:13px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"].s-pending{background:#fff;color:var(--wait);box-shadow:var(--sh);outline:1px solid var(--wait-line)}
.seg button[aria-pressed="true"].s-received{background:#fff;color:var(--ok);box-shadow:var(--sh);outline:1px solid var(--ok-line)}
.seg button[aria-pressed="true"].s-missing{background:#fff;color:var(--bad);box-shadow:var(--sh);outline:1px solid var(--bad-line)}
.doc .notes{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-left:36px}
.doc .notes .field label{font-size:12px}
.doc .rowtools{display:flex;gap:2px;align-items:center}
.doc .when{font-size:12px;color:var(--ink-3);grid-column:1/-1;padding-left:36px;margin-top:-4px}
.adddoc{display:flex;gap:8px;padding:16px 20px;border-top:1px solid var(--line);background:#FBFCFD;border-radius:0 0 var(--r-lg) var(--r-lg)}
.taskreview{padding:16px 20px;border-bottom:1px solid var(--line);background:#FBFCFD}

/* by-document */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.grp .card-h{padding:14px 18px}
.grp ul{list-style:none;margin:0;padding:6px}
.grp li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm)}
.grp li:hover{background:var(--sunk)}
.grp li .c{font-weight:600;font-size:14px}
.grp li .d{font-size:12.5px;color:var(--ink-3)}
.linkbtn{border:0;background:none;padding:0;text-align:left;cursor:pointer;min-width:0}
.linkbtn:hover .c{color:var(--accent)}

/* pending (all projects) table */
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap}
.st:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}

.split2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.preview{border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);max-height:340px;overflow-y:auto;padding:8px}

function counts(docs){
  const c = { total:docs.length, received:0, pending:0, missing:0 };
  docs.forEach(d => c[d.status] = (c[d.status] || 0) + 1);
  c.open = c.pending + c.missing;
  c.pct = pct(c.received, c.total);
  return c;
}

/* ---------- parser for pasted pending lists ---------- */
const DOC_WORD = /(rental|shop|establishment|photo|pan\b|aadh|udyam|udhyam|mca|cheque|certificate|agreement|utility|bill|kyc|gst|itr|statement|dob)/i;
function parseList(text){
  const lines = String(text || "").replace(/\r/g, "").split("\n");
  const out = []; const map = new Map();
  let cur = null, prevBlank = true, note = "";
  for(const raw of lines){
    const l = raw.replace(/\t/g, " ").replace(/["“”]/g, "").replace(/\s+/g, " ").trim();
    if(!l){ prevBlank = true; continue; }
    const rm = l.match(/^reason\s*[:\-–]\s*(.+)$/i);
    if(rm){ note = rm[1].trim(); prevBlank = false; continue; }
    const bullet = /^([-*•–·]|\d+[.)])\s*/.test(l);
    const need = /^need\b/i.test(l);
    if((prevBlank || !cur) && !bullet && !need && !(DOC_WORD.test(l) && cur && cur.docs.length === 0)){
      const name = l.replace(/^[.\s]+/, "").replace(/[.:\s]+$/, "").trim();
      if(!name){ prevBlank = false; continue; }
      const key = name.toUpperCase();
      cur = map.get(key);
      if(!cur){ cur = { name, docs:[] }; map.set(key, cur); out.push(cur); }
    } else if(cur){
      let d = l.replace(/^([-*•–·]|\d+[.)])\s*/, "").replace(/^need\s+/i, "").replace(/\s*\(\s*/g, " (").replace(/\s+\)/g, ")").trim();
      if(d){
        d = d.charAt(0).toUpperCase() + d.slice(1);
        if(!cur.docs.some(x => x.toLowerCase() === d.toLowerCase())) cur.docs.push(d);
      }
    }
    prevBlank = false;
  }
  return { tasks: out, note };
}

    const email = $("#em").value.trim().toLowerCase();
    const errEl = $("#emErr");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){
      errEl.textContent = "Enter a valid email address, like name@gmail.com."; errEl.hidden = false; $("#emWrap").classList.add("bad"); $("#em").setAttribute("aria-invalid","true"); $("#em").focus(); return;
    }
    signIn({ email, name: $("#nm").value.trim(), via:"email" });
  };
  $("#em").oninput = () => { $("#emErr").hidden = true; $("#emWrap").classList.remove("bad"); $("#em").removeAttribute("aria-invalid"); };
  document.querySelectorAll("[data-known]").forEach(b => b.onclick = () => signIn(users[+b.dataset.known]));
  $("#saveGcid").onclick = () => {
    const v = $("#gcid").value.trim();
    if(v && !/\.apps\.googleusercontent\.com$/.test(v)){ toast("That doesn't look like a Google Client ID"); return; }
    LS.set(KEY.gcid, v); renderLogin(); toast(v ? "Client ID saved" : "Client ID cleared");
  };
  if(hasG) initGoogle();
}

function initGoogle(){
  const showErr = m => { const e = $("#gsiErr"); if(e){ e.textContent = m; e.hidden = false; } };
  const go = () => {
    try{
      google.accounts.id.initialize({
        client_id: clientId(),
        callback: r => {
          try{
            const p = JSON.parse(decodeURIComponent(atob(r.credential.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join("")));
            signIn({ email:p.email, name:p.name, picture:p.picture, via:"google" });
          }catch(e){ showErr("Google sign-in returned an unreadable response. Try again."); }
        }
      });
      const el = $("#gsiBtn");
      if(el) google.accounts.id.renderButton(el, { theme:"outline", size:"large", shape:"pill", text:"signin_with", width:320 });
    }catch(e){ showErr("Google sign-in could not start. Check the Client ID."); }
  };
  if(window.google && google.accounts) return go();
  const s = document.createElement("script");
  s.src = "https://accounts.google.com/gsi/client"; s.async = true;
  s.onload = go;
  s.onerror = () => showErr("Google sign-in is blocked here. Use your Gmail address below.");
  document.head.appendChild(s);
}

function signIn(u){
  if(!u || !u.email) return;
  S.user = { email:u.email.toLowerCase(), name:u.name || "", picture:u.picture || "", via:u.via || "email" };
  LS.set(KEY.session, S.user);
  rememberUser(S.user);
  load(S.user.email);
  S.ui = { view:"home", pid:null, tid:null, tab:"overview", filter:"all", q:"", pq:"", pfilter:"open" };
  render();
  toast("Signed in as " + S.user.email);
}
function signOut(){
  LS.del(KEY.session);
  try{ if(window.google && google.accounts) google.accounts.id.disableAutoSelect(); }catch(e){}
  S.user = null; S.data = { projects:[] };
  renderLogin();
}

   SHELL
   ============================================================ */

        <button type="button" data-nav="pending" ${S.ui.view === "pending" ? 'aria-current="page"' : ""}>${ic("inbox")}<span class="lbl">All pending</span>${openAll ? `<span class="count">${openAll}</span>` : ""}</button>

document.addEventListener("click", e => {

document.addEventListener("keydown", e => {

function renderMain(){
  const m = $("#main"); if(!m) return;
  if(S.ui.view === "project") m.innerHTML = viewProject();
  else if(S.ui.view === "pending") m.innerHTML = viewPending();
  else m.innerHTML = viewHome();
  bindActs(m);
  bindMain(m);
}

/* generic action dispatcher */
function bindActs(root){
  root.querySelectorAll("[data-act]").forEach(el => {
    if(el._bound) return; el._bound = true;
    el.addEventListener("click", e => { e.stopPropagation(); act(el.dataset.act, el.dataset, el); });
  });
}
function act(a, d, el){
  const p = proj(S.ui.pid);
  switch(a){
    case "newProject": return modalProject();
    case "openProject": S.ui.view = "project"; S.ui.pid = d.id; S.ui.tid = null; S.ui.tab = "overview"; S.ui.filter = "all"; S.ui.q = ""; render(); window.scrollTo(0, 0); return;
    case "home": S.ui.view = "home"; S.ui.pid = null; render(); return;
    case "tab": S.ui.tab = d.tab; if(d.tab !== "tasks") S.ui.tid = null; renderMain(); return;
    case "filter": S.ui.filter = d.f; renderMain(); return;
    case "pfilter": S.ui.pfilter = d.f; renderMain(); return;
    case "openTask": S.ui.view = "project"; if(d.pid) S.ui.pid = d.pid; S.ui.tab = "tasks"; S.ui.tid = d.id; render(); requestAnimationFrame(() => { const dp = $(".dpanel"); if(dp && window.innerWidth <= 900) dp.scrollIntoView({ block:"start" }); }); return;
    case "backTasks": S.ui.tid = null; renderMain(); return;
    case "addTask": return modalTask();
    case "renameTask": return modalTask(taskOf(p, d.id));
    case "editProject": return modalProject(p);
    case "delProject": return confirmDelete({
        title:`Delete “${p.name}”?`,
        body:`This removes ${p.tasks.length} task${p.tasks.length === 1 ? "" : "s"} and ${allDocs(p).length} document record${allDocs(p).length === 1 ? "" : "s"}. This can't be undone. Download an Excel report first if you need a copy.`,
        label:"Delete project",
        go:() => { S.data.projects = S.data.projects.filter(x => x.id !== p.id); save(); S.ui.view = "home"; S.ui.pid = null; render(); toast("Project deleted"); }
      });
    case "delTask": { const t = taskOf(p, d.id); return confirmDelete({
        title:`Delete task “${t.name}”?`, body:`Its ${t.docs.length} document record${t.docs.length === 1 ? "" : "s"} will be removed too. This can't be undone.`, label:"Delete task",
        go:() => { p.tasks = p.tasks.filter(x => x.id !== t.id); S.ui.tid = null; save(); renderMain(); toast("Task deleted"); }
      }); }
    case "delDoc": { const t = taskOf(p, S.ui.tid); if(!t) return; const dc = t.docs.find(x => x.id === d.id); return confirmDelete({
        title:`Remove “${dc.name}”?`, body:`It will no longer be tracked for ${t.name}.`, label:"Remove document",
        go:() => { t.docs = t.docs.filter(x => x.id !== dc.id); save(); renderMain(); }
      }); }
    case "status": setStatus(d.id, d.s); return;
    case "toggle": { const dc = findDoc(d.id); if(dc) setStatus(d.id, dc.status === "received" ? "pending" : "received"); return; }
    case "allReceived": { const t = taskOf(p, S.ui.tid); if(!t) return; t.docs.forEach(x => { if(x.status !== "received"){ x.status = "received"; x.updatedAt = now(); } }); save(); renderMain(); toast(`All documents received for ${t.name}`); return; }
    case "export": return exportXlsx(p);
    case "backup": return downloadBackup();
    case "signout": return signOut();
  }
}
function findDoc(id){
  for(const p of S.data.projects) for(const t of p.tasks){ const d = t.docs.find(x => x.id === id); if(d) return d; }
  return null;
}
function setStatus(id, s){
  const d = findDoc(id); if(!d || d.status === s) return;
  d.status = s; d.updatedAt = now(); save();
  const y = window.scrollY; renderMain(); window.scrollTo(0, y);
  if(s === "missing"){ const r = document.querySelector(`[data-reason="${id}"]`); if(r && !r.value) r.focus(); }
}

/* bind inputs after main render */
function bindMain(m){
  const sq = $("#q", m);
  if(sq){ sq.oninput = () => { S.ui.q = sq.value; const pos = sq.selectionStart; renderMain(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); }; }
  const pq = $("#pq", m);
  if(pq){ pq.oninput = () => { S.ui.pq = pq.value; const pos = pq.selectionStart; renderMain(); const n = $("#pq"); n.focus(); n.setSelectionRange(pos, pos); }; }
  m.querySelectorAll("[data-reason]").forEach(inp => inp.oninput = debounce(() => { const d = findDoc(inp.dataset.reason); if(d){ d.reason = inp.value; d.updatedAt = now(); save(); } }, 300));
  m.querySelectorAll("[data-review]").forEach(inp => inp.oninput = debounce(() => { const d = findDoc(inp.dataset.review); if(d){ d.review = inp.value; d.updatedAt = now(); save(); } }, 300));
  const tr = $("#taskReview", m);
  if(tr) tr.oninput = debounce(() => { const t = taskOf(proj(S.ui.pid), S.ui.tid); if(t){ t.review = tr.value; save(); } }, 300);
  const ad = $("#addDocForm", m);
  if(ad) ad.onsubmit = e => {
    e.preventDefault();
    const inp = $("#newDoc"); const v = inp.value.trim(); if(!v) { inp.focus(); return; }
    const t = taskOf(proj(S.ui.pid), S.ui.tid); if(!t) return;
    v.split(/\n|;/).map(x => x.trim()).filter(Boolean).forEach(n => t.docs.push(mkDoc(n)));
    save(); renderMain(); const n = $("#newDoc"); if(n) n.focus();
  };
  m.querySelectorAll("tr[data-row-task]").forEach(tr => {
    tr.onclick = () => act("openTask", { id: tr.dataset.rowTask, pid: tr.dataset.pid });
    tr.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); tr.onclick(); } };
  });
}
function debounce(fn, ms){ let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }

/* ============================================================
   VIEWS
   ============================================================ */
function viewHome(){
  const ps = S.data.projects;
  const head = `<div class="pagehead"><div><h1>Projects</h1><p class="meta">${ps.length ? `${ps.length} project${ps.length === 1 ? "" : "s"} · signed in as ${esc(S.user.email)}` : "Start by pasting a pending-documents list."}</p></div></div>`;
  if(!ps.length) return head + `<div class="card"><div class="empty">
      <div class="ic">${ic("folder")}</div>
      <h3>No projects yet</h3>
      <p>Create a project, paste your list of companies and pending documents, and DocTrack turns each company into a task.</p>
      <button class="btn primary" type="button" data-act="newProject">${ic("plus","sm")}Create first project</button>
    </div></div>`;
  return head + `<div class="pgrid">
    ${ps.map(p => { const c = counts(allDocs(p)); return `
      <button type="button" class="pcard" data-act="openProject" data-id="${p.id}">
        <div class="top">
          <div style="min-width:0"><h3>${esc(p.name)}</h3><p class="muted small" style="margin-top:4px">${p.note ? esc(p.note) + " · " : ""}Created ${fmtDate(p.createdAt)}</p></div>
          <span class="pct" style="color:${c.pct === 100 && c.total ? "var(--ok)" : "var(--ink)"}">${c.pct}%</span>
        </div>
        ${bar(c)}
        <div class="stats"><span><b>${p.tasks.length}</b> tasks</span><span><b style="color:var(--ok)">${c.received}</b> received</span><span><b style="color:var(--wait)">${c.pending}</b> pending</span><span><b style="color:var(--bad)">${c.missing}</b> not rec.</span></div>
      </button>`; }).join("")}
    <button type="button" class="pcard pnew" data-act="newProject">${ic("plus")}New project</button>
  </div>`;
}
function bar(c){
  if(!c.total) return `<div class="bar" aria-hidden="true"></div>`;
  return `<div class="bar" role="img" aria-label="${c.received} received, ${c.pending} pending, ${c.missing} not received">
    <i class="b-ok" style="width:${c.received / c.total * 100}%"></i><i class="b-wait" style="width:${c.pending / c.total * 100}%"></i><i class="b-bad" style="width:${c.missing / c.total * 100}%"></i></div>`;
}

function viewProject(){
  const p = proj(S.ui.pid); const docs = allDocs(p); const c = counts(docs);
  const tabs = [["overview","Dashboard","grid"],["tasks","Tasks","list"],["bydoc","By document","layers"]];
  const filters = [["all","All",c.total,""],["pending","Pending",c.pending,"#E39A2D"],["received","Received",c.received,"#2E9E5B"],["missing","Not received",c.missing,"#D9534A"]];
  let body = "";
  if(S.ui.tab === "tasks") body = viewTasks(p);
  else if(S.ui.tab === "bydoc") body = viewByDoc(p);
  else body = viewOverview(p, c);
  return `
  <div class="pagehead">
    <div style="min-width:0">
      <div class="crumbs"><button type="button" data-act="home">Projects</button><span aria-hidden="true">/</span><span>${esc(p.name)}</span></div>
      <h1>${esc(p.name)}</h1>
      <p class="meta">${p.note ? `<span class="tag">${esc(p.note)}</span>` : ""}<span>${p.tasks.length} tasks · ${c.total} documents · ${c.pct}% collected</span></p>
    </div>
    <div class="actions">
      <button class="btn" type="button" data-act="addTask">${ic("plus","sm")}Add task</button>
      <button class="btn primary" type="button" data-act="export">${ic("sheet","sm")}Export Excel</button>

      <button class="btn icon text-bad" type="button" data-act="delProject" aria-label="Delete project" title="Delete project">${ic("trash","sm")}</button>
    </div>
  </div>
  <div class="capsulebar" role="toolbar" aria-label="Project views and filters">
    <div class="capsules" role="group" aria-label="View">
      ${tabs.map(([k, l, i]) => `<button type="button" class="cap" data-act="tab" data-tab="${k}" aria-pressed="${S.ui.tab === k}">${ic(i,"sm")}${l}</button>`).join("")}
    </div>
    ${S.ui.tab !== "overview" ? `<span class="vsep" aria-hidden="true"></span>
    <div class="capsules" role="group" aria-label="Status filter">
      ${filters.map(([k, l, n, col]) => `<button type="button" class="cap" data-act="filter" data-f="${k}" aria-pressed="${S.ui.filter === k}">${col ? `<span class="sw" style="background:${col}"></span>` : ""}${l}<span class="n">${n}</span></button>`).join("")}
    </div>
    <div class="search">${ic("search","sm")}<label class="sr" for="q">Search companies or documents</label><input id="q" type="search" placeholder="Search company or document" value="${esc(S.ui.q)}"></div>` : ""}
  </div>
  ${body}`;
}

function viewOverview(p, c){
  if(!p.tasks.length) return emptyTasks();
  const rows = p.tasks.map(t => ({ t, c:counts(t.docs) })).sort((a, b) => b.c.open - a.c.open || a.t.name.localeCompare(b.t.name));
  const cats = {};
  allDocs(p).forEach(d => { const k = catOf(d.name); cats[k] = cats[k] || { total:0, open:0, received:0 }; cats[k].total++; if(d.status === "received") cats[k].received++; else cats[k].open++; });
  const catRows = Object.entries(cats).sort((a, b) => b[1].open - a[1].open);
  const doneTasks = rows.filter(r => r.c.total && r.c.open === 0).length;
  return `
  <div class="kpis">
    <div class="kpi"><div class="l">${ic("doc","sm")}Total documents</div><div class="v">${c.total}</div></div>
    <div class="kpi ok"><div class="l">${ic("check","sm")}Received</div><div class="v">${c.received}</div></div>
    <div class="kpi wait"><div class="l">${ic("clock","sm")}Pending</div><div class="v">${c.pending}</div></div>
    <div class="kpi bad"><div class="l">${ic("alert","sm")}Not received</div><div class="v">${c.missing}</div></div>
    <div class="kpi"><div class="l">${ic("shield","sm")}Completed tasks</div><div class="v">${doneTasks}<span class="muted" style="font-size:16px;font-weight:600"> / ${rows.length}</span></div></div>
  </div>
  <div class="card" style="padding:16px 20px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><b>Collection progress</b><span class="pct">${c.pct}%</span></div>
    ${bar(c)}
  </div>
  <div class="ovgrid">
    <section class="card">
      <div class="card-h"><h3>Tasks by pending documents</h3><span class="muted small">Select a row to open the task</span></div>
      <div class="tbl-wrap"><table class="t">
        <thead><tr><th>Company</th><th class="num">Received</th><th class="num">Pending</th><th class="num">Not rec.</th><th style="width:120px">Progress</th></tr></thead>
        <tbody>${rows.map(({ t, c }) => `<tr class="click" tabindex="0" data-row-task="${t.id}">
          <td><b style="font-weight:600">${esc(t.name)}</b>${c.total && !c.open ? ` <span class="chip done">Done</span>` : ""}</td>
          <td class="num" style="color:var(--ok)">${c.received}</td><td class="num" style="color:var(--wait)">${c.pending}</td><td class="num" style="color:var(--bad)">${c.missing}</td>
          <td>${bar(c)}</td></tr>`).join("")}</tbody>
      </table></div>
    </section>
    <section class="card">
      <div class="card-h"><h3>Still to collect, by document</h3></div>
      <div class="card-b" style="padding-top:6px;padding-bottom:6px">
        ${catRows.map(([k, v]) => `<div class="typebar"><span class="nm">${esc(k)}</span><span class="ct">${v.open} open · ${v.received}/${v.total}</span>
          <div class="bar"><i class="b-ok" style="width:${v.received / v.total * 100}%"></i><i class="b-wait" style="width:${v.open / v.total * 100}%"></i></div></div>`).join("")}
      </div>
    </section>
  </div>`;
}
function emptyTasks(){
  return `<div class="card"><div class="empty"><div class="ic">${ic("list")}</div><h3>No tasks in this project</h3><p>Add a task for each company you're collecting documents from.</p><button class="btn primary" type="button" data-act="addTask">${ic("plus","sm")}Add task</button></div></div>`;
}

function matchDoc(d){
  const f = S.ui.filter;
  return f === "all" || d.status === f;
}
function filteredTasks(p){
  const q = S.ui.q.trim().toLowerCase();
  return p.tasks.map(t => {
    const nameHit = !q || t.name.toLowerCase().includes(q);
    const docs = t.docs.filter(d => matchDoc(d) && (nameHit || d.name.toLowerCase().includes(q)));
    return { t, docs };
  }).filter(x => x.docs.length || (S.ui.filter === "all" && (!q || x.t.name.toLowerCase().includes(q))));
}

function viewTasks(p){
  if(!p.tasks.length) return emptyTasks();
  const list = filteredTasks(p);
  let sel = taskOf(p, S.ui.tid);
  const wide = window.innerWidth > 900;
  if(!sel && wide && list.length){ sel = list[0].t; S.ui.tid = sel.id; }
  return `<div class="tasks ${S.ui.tid ? "show-docs" : ""}">
    <aside class="card tlist" aria-label="Tasks">
      <div class="card-h"><h3>Tasks <span class="muted" style="font-weight:600">${list.length}</span></h3><button class="btn ghost sm" type="button" data-act="addTask">${ic("plus","sm")}Add</button></div>
      <div class="tl-scroll">
        ${list.length ? list.map(({ t }) => { const c = counts(t.docs); return `
          <button type="button" class="titem" data-act="openTask" data-id="${t.id}" ${sel && sel.id === t.id ? 'aria-current="true"' : ""}>
            <span class="row1"><span class="nm">${esc(t.name)}</span><span class="muted small" style="font-variant-numeric:tabular-nums">${c.received}/${c.total}</span></span>
            <span class="chips">${c.total && !c.open ? `<span class="chip done">${ic("check","sm")}All received</span>` : `${c.pending ? `<span class="chip wait">${c.pending} pending</span>` : ""}${c.missing ? `<span class="chip bad">${c.missing} not received</span>` : ""}${!c.total ? `<span class="chip wait">No documents</span>` : ""}`}</span>
          </button>`; }).join("") : `<p class="muted small" style="padding:16px">No tasks match this filter.</p>`}
      </div>
    </aside>
    ${sel ? docPanel(p, sel) : `<section class="card dpanel"><div class="empty"><div class="ic">${ic("search")}</div><h3>Nothing to show</h3><p>Change the filter or search to see tasks.</p></div></section>`}
  </div>`;
}

function docPanel(p, t){
  const c = counts(t.docs);
  const q = S.ui.q.trim().toLowerCase();
  const nameHit = !q || t.name.toLowerCase().includes(q);
  const docs = t.docs.filter(d => matchDoc(d) && (nameHit || d.name.toLowerCase().includes(q)));
  return `<section class="card dpanel" aria-label="${esc(t.name)} documents">
    <div class="card-h">
      <div class="title">
        <button class="btn ghost sm back" type="button" data-act="backTasks" style="align-self:flex-start;margin-left:-8px">${ic("left","sm")}All tasks</button>
        <h3>${esc(t.name)}</h3>
        <span class="muted small">${c.received} of ${c.total} received${c.missing ? ` · ${c.missing} not received` : ""}</span>

let lastFocus = null;
function openModal(html, onMount){
  closeModal(true);
  lastFocus = document.activeElement;
  const sc = document.createElement("div");
  sc.className = "scrim";
  sc.innerHTML = html;
  sc.addEventListener("mousedown", e => { if(e.target === sc) closeModal(); });
  sc.addEventListener("keydown", e => {
    if(e.key !== "Tab") return;
    const f = [...sc.querySelectorAll("button,input,textarea,select,[tabindex]:not([tabindex='-1'])")].filter(x => !x.disabled && x.offsetParent !== null);
    if(!f.length) return;
    if(e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length - 1].focus(); }
    else if(!e.shiftKey && document.activeElement === f[f.length - 1]){ e.preventDefault(); f[0].focus(); }
  });
  document.body.appendChild(sc);
  document.body.style.overflow = "hidden";
  sc.querySelectorAll("[data-close]").forEach(b => b.onclick = () => closeModal());
  onMount && onMount(sc);
  const first = sc.querySelector("[autofocus]") || sc.querySelector("input,textarea,button");
  if(first) first.focus();
}
function closeModal(silent){
  const sc = document.querySelector(".scrim"); if(!sc) return;
  sc.remove(); document.body.style.overflow = "";
  if(!silent && lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

/* In the Claude artifact viewer files go through claude.use("downloads"); elsewhere a normal download link. */
let DL = null;
(async () => { try{ if(window.claude && typeof window.claude.use === "function") DL = await window.claude.use("downloads"); }catch(e){ DL = null; } })();
async function downloadBlob(blob, name){
  if(DL){
    try{ await DL.save({ filename:name, data:blob }); return true; }
    catch(e){
      if(e && e.code === "declined") return false;
      if(e && e.code === "rate_limited"){ toast("A save is already waiting — finish that first"); return false; }
      toast("Downloads aren't available in this view"); return false;
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return true;
}
async function downloadBackup(){

function restoreBackup(e){
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const j = JSON.parse(rd.result); const d = j.data || j;
      if(!d || !Array.isArray(d.projects)) throw new Error("bad");
      let added = 0;
      d.projects.forEach(p => {
        if(!p || !p.id || !Array.isArray(p.tasks)) return;
        if(S.data.projects.some(x => x.id === p.id)) return;
        p.tasks.forEach(t => { t.docs = Array.isArray(t.docs) ? t.docs : []; t.docs.forEach(x => { if(!STATUS[x.status]) x.status = "pending"; }); });
        S.data.projects.push(p); added++;
      });
      save(); render(); toast(added ? `Restored ${added} project${added === 1 ? "" : "s"}` : "No new projects in that backup");
    }catch(err){ toast("That file isn't a DocTrack backup"); }
  };
  rd.readAsText(f);
}

const CRC_T = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for(let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files){
  const enc = new TextEncoder(); const parts = [], central = []; let off = 0;
  const d = new Date(); const dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  files.forEach(f => {
    const nb = enc.encode(f.name); const data = enc.encode(f.data); const crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dt, true); h.setUint16(12, dd, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
    h.setUint16(26, nb.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), nb, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dt, true); c.setUint16(14, dd, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, nb.length, true); c.setUint16(30, 0, true); c.setUint16(32, 0, true); c.setUint16(34, 0, true); c.setUint16(36, 0, true); c.setUint32(38, 0, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nb);
    off += 30 + nb.length + data.length;
  });
  const size = central.reduce((s, p) => s + p.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

const colL = n => { let s = ""; n++; while(n){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };

function sheetXml({ rows, cols, freeze, filter, merges, heights }){
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';

      if(c == null) return;
      const cell = typeof c === "object" ? c : { v:c };
      const ref = colL(ci) + (ri + 1); const s = cell.s != null ? ` s="${cell.s}"` : "";
      if(cell.v === "" || cell.v == null) x += `<c r="${ref}"${s}/>`;
      else if(typeof cell.v === "number") x += `<c r="${ref}"${s}><v>${cell.v}</v></c>`;
      else x += `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xesc(cell.v)}</t></is></c>`;
    });
    x += "</row>";
  });
  x += "</sheetData>";
  if(filter) x += `<autoFilter ref="${filter}"/>`;
  if(merges && merges.length) x += `<mergeCells count="${merges.length}">` + merges.map(m => `<mergeCell ref="${m}"/>`).join("") + "</mergeCells>";
  x += '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/>';
  return x + "</worksheet>";
}

async function exportXlsx(p){
  const docs = allDocs(p); const c = counts(docs);
  const stamp = new Date().toLocaleString(undefined, { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
  const stS = s => XS[s];

  /* Sheet 1 — Dashboard */
  const d1 = []; const merges = []; const heights = {};
  d1[0] = [{ v:p.name + " — Document Collection", s:XS.title }]; heights[0] = 30; merges.push("A1:H1");
  d1[1] = [{ v:(p.note ? p.note + "  ·  " : "") + "Generated " + stamp + "  ·  " + S.user.email, s:XS.sub }]; merges.push("A2:H2");
  d1[3] = [{ v:"Total documents", s:XS.label }, { v:"Received", s:XS.label }, { v:"Pending", s:XS.label }, { v:"Not received", s:XS.label }, { v:"Completion", s:XS.label }, { v:"Tasks", s:XS.label }, { v:"Tasks complete", s:XS.label }];
  const doneT = p.tasks.filter(t => t.docs.length && t.docs.every(x => x.status === "received")).length;
  d1[4] = [{ v:c.total, s:XS.big }, { v:c.received, s:XS.big }, { v:c.pending, s:XS.big }, { v:c.missing, s:XS.big }, { v:c.total ? c.received / c.total : 0, s:XS.pct }, { v:p.tasks.length, s:XS.big }, { v:doneT, s:XS.big }];
  heights[4] = 34;
  let r = 6;
  d1[r++] = [{ v:"Company status", s:XS.title }]; heights[r - 1] = 26;
  d1[r++] = ["#", "Company", "Total", "Received", "Pending", "Not received", "Completion", "Still to collect", "Task review"].map(v => ({ v, s:XS.head }));
  p.tasks.forEach((t, i) => {
    const tc = counts(t.docs);
    const open = t.docs.filter(x => x.status !== "received").map(x => x.name + (x.status === "missing" ? " (not received" + (x.reason ? ": " + x.reason : "") + ")" : x.reason ? " (" + x.reason + ")" : "")).join("; ");
    d1[r++] = [{ v:i + 1, s:XS.num }, { v:t.name, s:XS.cell }, { v:tc.total, s:XS.num }, { v:tc.received, s:tc.received ? XS.received : XS.num }, { v:tc.pending, s:tc.pending ? XS.pending : XS.num }, { v:tc.missing, s:tc.missing ? XS.missing : XS.num }, { v:tc.total ? tc.received / tc.total : 0, s:XS.pct }, { v:open || "All received", s:XS.cell }, { v:t.review || "", s:XS.cell }];
  });
  r++;
  d1[r++] = [{ v:"Pending by document type", s:XS.title }]; heights[r - 1] = 26;
  d1[r++] = ["Document type", "Total", "Received", "Still open", "Completion"].map(v => ({ v, s:XS.head }));
  const cats = {};
  docs.forEach(x => { const k = catOf(x.name); cats[k] = cats[k] || [0, 0]; cats[k][0]++; if(x.status === "received") cats[k][1]++; });
  Object.entries(cats).sort((a, b) => (b[1][0] - b[1][1]) - (a[1][0] - a[1][1])).forEach(([k, [tot, rec]]) => {
    d1[r++] = [{ v:k, s:XS.cell }, { v:tot, s:XS.num }, { v:rec, s:XS.num }, { v:tot - rec, s:tot - rec ? XS.pending : XS.num }, { v:tot ? rec / tot : 0, s:XS.pct }];
  });

  /* Sheet 2 — All documents */
  const head2 = ["#", "Company", "Document", "Document type", "Status", "Reason (not received)", "Review", "Last updated"];
  const d2 = [head2.map(v => ({ v, s:XS.head }))];
  let n = 0;
  p.tasks.forEach(t => t.docs.forEach(x => {
    d2.push([{ v:++n, s:XS.num }, { v:t.name, s:XS.cell }, { v:x.name, s:XS.cell }, { v:catOf(x.name), s:XS.cell }, { v:STATUS[x.status].label, s:stS(x.status) }, { v:x.reason || "", s:XS.cell }, { v:x.review || "", s:XS.cell }, { v:fmtDT(x.updatedAt), s:XS.cell }]);
  }));

  /* Sheet 3 — Pending only */
  const d3 = [["#", "Company", "Document", "Status", "Reason (not received)", "Review", "Received? (tick)"].map(v => ({ v, s:XS.head }))];
  let m = 0;
  p.tasks.forEach(t => t.docs.filter(x => x.status !== "received").forEach(x => {
    d3.push([{ v:++m, s:XS.num }, { v:t.name, s:XS.cell }, { v:x.name, s:XS.cell }, { v:STATUS[x.status].label, s:stS(x.status) }, { v:x.reason || "", s:XS.cell }, { v:x.review || "", s:XS.cell }, { v:"", s:XS.cell }]);
  }));

  const sheets = [
    { name:"Dashboard", xml:sheetXml({ rows:d1, cols:[16, 34, 14, 14, 14, 16, 14, 60, 36], merges, heights }) },
    { name:"All Documents", xml:sheetXml({ rows:d2, cols:[6, 34, 46, 30, 15, 40, 36, 20], freeze:1, filter:`A1:H${Math.max(d2.length, 2)}` }) },
    { name:"Pending", xml:sheetXml({ rows:d3, cols:[6, 34, 46, 15, 40, 36, 16], freeze:1, filter:`A1:G${Math.max(d3.length, 2)}` }) }
  ];
  const files = [
    { name:"[Content_Types].xml", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("") + '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>' },
    { name:"_rels/.rels", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>' },
    { name:"docProps/core.xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xesc(p.name)}</dc:title><dc:creator>DocTrack</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0, 19)}Z</dcterms:created></cp:coreProperties>` },
    { name:"xl/workbook.xml", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>' + sheets.map((s, i) => `<sheet name="${xesc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("") + `</sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="1" hidden="1">'All Documents'!$A$1:$H$${Math.max(d2.length, 2)}</definedName><definedName name="_xlnm._FilterDatabase" localSheetId="2" hidden="1">Pending!$A$1:$G$${Math.max(d3.length, 2)}</definedName></definedNames></workbook>` },
    { name:"xl/_rels/workbook.xml.rels", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("") + `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name:"xl/styles.xml", data:STYLES },
    ...sheets.map((s, i) => ({ name:`xl/worksheets/sheet${i + 1}.xml`, data:s.xml }))
  ];
  const safe = p.name.replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, "_").slice(0, 60) || "project";
  if(await downloadBlob(zipStore(files), `${safe}_documents_${new Date().toISOString().slice(0, 10)}.xlsx`)) toast("Excel report downloaded");
}

  const s = LS.get(KEY.session, null);
  if(s && s.email){ S.user = s; load(s.email); render(); }
  else renderLogin();
  let w = window.innerWidth;
  window.addEventListener("resize", debounce(() => { const nw = window.innerWidth; if((w > 900) !== (nw > 900) && S.user && !document.querySelector(".scrim")){ renderMain(); } w = nw; }, 150));
})();
